<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂互动 · 学生作答</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/student.css"><script src="/app.js" defer></script></head>
<body data-view="student"><header class="topbar"><div><span class="eyebrow">HTML Course Player</span><h1>随堂作答</h1></div><span id="connection" class="connection">连接中</span></header><main class="student-main"><div id="guard-note" class="guard-note" hidden role="status"></div><section id="join-panel" class="panel join-panel"><span class="eyebrow">加入本堂课堂</span><h2 id="join-title">课堂互动</h2><p class="subtle">输入本人学号，姓名将由点名册关联。</p><form id="join-form" class="stack"><label>学号<input id="student-id" name="student_id" autocomplete="username" inputmode="numeric" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}" placeholder="请输入完整学号" required></label><div id="roster-name" class="name-status" aria-live="polite">等待输入学号</div><label id="manual-name-label" hidden>姓名<input id="student-name" name="name" autocomplete="name" maxlength="30" placeholder="请输入姓名"></label><div id="identity-confirm" class="identity-confirm" hidden><p id="switch-message"></p><label><input id="confirm-switch" type="checkbox">我确认使用本人身份，知悉身份切换将被记录。</label></div><div class="switch-actions"><button id="join-submit" class="button" type="submit">进入课堂</button><button id="cancel-switch" type="button" class="button secondary" hidden>返回作答</button></div><p id="join-error" class="form-error" role="alert"></p></form><p class="privacy-note">姓名、学号、答题及身份切换记录保存在教师电脑。系统记录来源IP、浏览器编号及浏览器/系统、语言、时区、屏幕尺寸，用于辅助识别切换与自动化操作；投屏默认只展示汇总结果。</p></section>
<section id="student-room" hidden><div class="room-heading"><div><h2 id="class-title"></h2><p id="student-identity" class="subtle"></p></div><div><span id="student-status" class="badge">等待发题</span> <button id="switch-identity" class="text-button">切换身份</button></div></div><section id="waiting-panel" class="panel waiting"><div class="waiting-symbol">?</div><h2>等待老师发题</h2><p>题目发布后会自动出现，保留本页面即可。</p></section><section id="student-question-panel" class="panel student-question-panel" hidden><div class="question-meta"><span id="question-meta" class="eyebrow"></span><span class="timer"><b id="student-countdown">—</b> 秒</span></div><h2 id="student-question-title" class="question-title"></h2><pre id="student-code" class="code-block" hidden></pre><div id="student-options" class="student-options" role="group" aria-label="选择答案"></div><div class="submit-row"><button id="submit-vote" class="button" disabled>提交答案</button><p id="vote-status" class="subtle" role="status">选择一个选项后提交。</p></div><div id="student-result" class="answer-box" hidden></div><div id="student-chart"></div></section></section></main><div id="toast" class="toast" role="status" hidden></div></body></html>
