<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂互动 · 教师控制</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/rounds.css"><script src="/rounds.js" defer></script><script src="/app.js" defer></script></head>
<body data-view="teacher"><header class="topbar"><div><span class="eyebrow">HTML Course Player</span><h1>课堂互动</h1></div><div class="header-actions"><span id="connection" class="connection">连接中</span><a class="button quiet" href="/projector" target="_blank" rel="noopener">打开投屏</a><a class="button quiet" href="/api/export.csv">导出本堂CSV</a></div></header>
<main class="teacher-layout"><aside class="sidebar"><section class="panel"><div class="section-head"><h2>本堂课堂</h2><button id="new-session" class="text-button">新建课堂</button></div><p id="session-title" class="session-title"></p><div class="join-address"><small>学生在电脑浏览器输入</small><strong id="student-url">读取地址中</strong><button id="copy-address" class="text-button">复制地址</button></div><p class="subtle">姓名与学号必填。教师控制仅在本机开放。</p></section>
<section class="panel"><h2>当前讲授位置</h2><form id="progress-form" class="inline-form"><label>章节<select id="chapter"><option>Demo</option></select></label><label>当前页<input id="progress" type="number" min="1" max="200" value="1" required></label><button type="submit" class="button small">切换</button></form><p id="progress-note" class="subtle">题目与当前讲授页对应，由教师发起。</p></section>
<section class="panel bank-panel"><div class="section-head"><h2>随堂题库</h2><span id="question-count" class="badge"></span></div><label class="search-label">查找题目<input id="question-search" type="search" placeholder="知识点或题目关键词"></label><div id="question-list" class="question-list"></div></section>
<details class="panel"><summary>临时出题</summary><form id="custom-form" class="stack"><label>题型<select id="custom-kind"><option value="choice">单项选择</option><option value="tf">判断题</option><option value="poll">观点选择（无标准答案）</option></select></label><label>题目<textarea id="custom-title" maxlength="600" required rows="3"></textarea></label><label>代码（可留空）<textarea id="custom-code" rows="3" maxlength="3000"></textarea></label><label>选项（每行一个，2至6项）<textarea id="custom-options" rows="4" required></textarea></label><label id="custom-answer-label">正确选项<select id="custom-answer"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option><option value="4">E</option><option value="5">F</option></select></label><label>解析<textarea id="custom-explanation" rows="3" maxlength="1200"></textarea></label><button class="button" type="submit">发起临时题目</button></form></details></aside>
<div class="work-area"><section class="panel preview-panel"><div class="section-head"><h2>待发题目</h2><span id="preview-meta" class="badge">从左侧选择</span></div><div id="preview"><p class="empty-note">选择一题，预览后发给学生。</p></div><div class="launch-controls"><label>作答时间<select id="duration"><option value="30">30秒</option><option value="60" selected>60秒</option><option value="90">90秒</option><option value="120">2分钟</option><option value="180">3分钟</option></select></label><button id="launch" class="button" disabled>发起提问</button></div></section>
<section class="panel live-panel"><div class="section-head"><h2>当前互动</h2><span id="round-status" class="badge">等待发题</span></div><div class="metrics"><div><strong id="joined-count">0</strong><span>已加入</span></div><div><strong id="submitted-count">0</strong><span>已作答</span></div><div><strong id="countdown">—</strong><span>剩余秒数</span></div></div><div id="current-question"></div><div id="chart"></div><div class="round-actions"><button id="close-round" class="button secondary" disabled>结束本轮</button><button id="toggle-live" class="button secondary" disabled>隐藏投屏分布</button><button id="reveal" class="button" disabled>公布答案与解析</button><button id="repeat" class="button secondary" disabled>再答一轮</button></div><div id="teacher-answer" class="answer-box" hidden></div></section>
<details class="panel"><summary>本堂参与名单 <span id="student-count"></span></summary><p class="subtle">仅教师端显示。姓名与学号为学生填写，当前不连接学籍认证。</p><div id="student-list" class="student-table"></div></details><details class="panel"><summary>本堂提问记录</summary><div id="history"></div></details><p class="footer-note">结果每秒刷新。答题记录保存在本机，可导出CSV。</p></div></main><div id="toast" class="toast" role="status" hidden></div></body></html>
